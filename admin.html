<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Quản lý chấm công</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }

  /* Đăng nhập */
  #login { max-width: 380px; margin: 12vh auto 0; padding: 32px 24px; text-align: center; }
  #login .logo { width: 56px; height: 56px; border-radius: 16px; background: var(--brand); color: #fff; display: grid; place-items: center; margin: 0 auto 16px; }
  #login .logo svg { width: 30px; height: 30px; }
  #login h1 { font-size: 22px; margin: 0 0 4px; }
  #login .field { text-align: left; }
  #login .btn { width: 100%; padding: 13px; margin-top: 4px; }
  .err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 10px 0 0; }

  /* Đầu trang */
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .head h1 { font-size: 24px; margin: 0; }
  .tools { display: flex; gap: 8px; }
  .month { display: flex; align-items: center; gap: 4px; background: var(--card); border-radius: 12px; padding: 4px; box-shadow: var(--shadow); }
  .month button { width: 36px; height: 36px; border-radius: 9px; background: transparent; font-size: 20px; color: var(--ink); }
  .month button:hover { background: var(--bg); }
  .month span { min-width: 120px; text-align: center; font-weight: 700; }

  /* Thẻ lương */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .stat { padding: 18px; }
  .stat .top { display: flex; align-items: center; gap: 12px; }
  .stat .name { font-weight: 700; font-size: 17px; }
  .stat .money { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 14px 0 2px; }
  .stat .meta { color: var(--muted); font-size: 14px; }
  .total { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; margin-top: 12px; background: var(--ink); color: #fff; border-radius: var(--radius); }
  .total b { font-size: 20px; }

  /* Cảnh báo */
  .alert { display: flex; gap: 12px; align-items: center; padding: 14px 16px; margin-top: 16px; border-radius: 14px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }
  .alert svg { width: 22px; height: 22px; flex: none; }

  /* Danh sách theo ngày */
  .section-head { display: flex; justify-content: space-between; align-items: center; margin: 32px 0 12px; gap: 8px; flex-wrap: wrap; }
  .section-head h2 { font-size: 18px; margin: 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { padding: 7px 14px; border-radius: 99px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; font-weight: 600; color: var(--ink); }
  .chip.on { background: var(--ink); color: #fff; box-shadow: none; }
  .day { margin-bottom: 14px; overflow: hidden; }
  .day-head { display: flex; justify-content: space-between; padding: 12px 16px; background: #faf8f5; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 700; }
  .day-head span:last-child { color: var(--muted); font-weight: 600; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row.open { background: var(--warn-soft); }
  .row .avatar { width: 36px; height: 36px; font-size: 15px; }
  .row .who { flex: 1; min-width: 0; }
  .row .who b { display: block; }
  .row .time { font-size: 14px; color: var(--muted); }
  .row .note { font-size: 13px; color: var(--muted); font-style: italic; }
  .row .dur { font-weight: 700; min-width: 56px; text-align: right; }
  .icon { width: 36px; height: 36px; border-radius: 10px; background: transparent; color: var(--muted); display: grid; place-items: center; }
  .icon:hover { background: var(--bg); color: var(--ink); }
  .icon svg { width: 18px; height: 18px; }
  .empty { text-align: center; padding: 48px 16px; color: var(--muted); }

  /* QR */
  #qrDlg { text-align: center; }
  #qr { display: inline-block; padding: 16px; background: #fff; border-radius: 16px; box-shadow: inset 0 0 0 2px var(--line); margin: 16px 0 8px; }
  #qr img, #qr canvas { display: block; }
  .poster-title { font-size: 26px; font-weight: 800; margin: 0; }
  @media print {
    body > *:not(#qrDlg) { display: none !important; }
    #qrDlg { position: static; box-shadow: none; width: 100%; } #qrDlg .actions { display: none; }
    #qrDlg::backdrop { display: none; }
  }
  @media (max-width: 560px) { .head h1 { font-size: 20px; } .tools .label { display: none; } .row { gap: 8px; padding: 12px; } }
</style>
</head>
<body>

<form id="login" class="card">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
  <h1>Quản lý chấm công</h1>
  <p class="muted" style="margin:0">Nhập mật khẩu để tiếp tục</p>
  <label class="field">Mật khẩu <input id="pass" type="password" autocomplete="current-password" required></label>
  <button class="btn">Đăng nhập</button>
  <p class="err" id="lerr"></p>
</form>

<main id="app" hidden>
  <div class="head">
    <h1>Bảng công</h1>
    <div class="month">
      <button id="prev" aria-label="Tháng trước">‹</button>
      <span id="mlabel"></span>
      <button id="next" aria-label="Tháng sau">›</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="total"><span>Tổng tiền lương tháng</span><b class="num" id="total"></b></div>
  <div id="alerts"></div>

  <div class="section-head">
    <h2>Lịch sử chấm công</h2>
    <div class="tools">
      <button class="btn ghost" id="showqr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg><span class="label">In mã QR</span></button>
      <button class="btn" id="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Chấm bù</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="days"></div>
  <p class="err" id="err"></p>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dtitle"></h3>
    <p class="muted" id="dsub" style="margin:0;font-size:14px"></p>
    <label class="field">Nhân viên <select name="ten"></select></label>
    <label class="field">Ngày <input name="ngay" type="date" required></label>
    <div style="display:flex;gap:12px">
      <label class="field" style="flex:1">Giờ vào <input name="vao" type="time" required></label>
      <label class="field" style="flex:1">Giờ ra <input name="ra" type="time"></label>
    </div>
    <label class="field">Ghi chú <input name="note" placeholder="VD: quên quét QR"></label>
    <div class="actions">
      <button class="btn ghost" value="cancel" formnovalidate>Huỷ</button>
      <button class="btn" value="ok">Lưu</button>
    </div>
  </form>
</dialog>

<dialog id="askDlg">
  <h3 id="askText"></h3>
  <p class="muted" id="askSub" style="margin:4px 0 0"></p>
  <div class="actions"><button class="btn ghost" id="askNo">Huỷ</button><button class="btn danger" id="askYes">Xoá</button></div>
</dialog>

<dialog id="qrDlg">
  <p class="poster-title">Quét mã để chấm công</p>
  <p class="muted" style="margin:6px 0 0">Mở Camera hoặc Zalo → quét → bấm tên của bạn</p>
  <div id="qr"></div>
  <p class="muted" id="qrurl" style="font-size:13px;word-break:break-all;margin:0"></p>
  <div class="actions"><button class="btn ghost" onclick="this.closest('dialog').close()">Đóng</button><button class="btn" onclick="print()">In</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="api.js"></script>
<script>
const DAYS = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
const ICON = {
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>',
};
let pass = sessionStorage.getItem('pass') || '';
let data = { shifts: [], staff: [] }, who = '';
const month = new Date(); month.setDate(1);

const adm = (action, body = {}) => api(action, { pass, ...body });
const money = n => Math.round(n).toLocaleString('vi-VN') + 'đ';
const ym = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
const color = ten => `c${Math.max(0, data.staff.findIndex(s => s.ten === ten)) % 4}`;
const today = () => new Date().toLocaleDateString('sv'); // yyyy-MM-dd theo giờ máy

async function load() {
  $('#err').textContent = '';
  $('#mlabel').textContent = `Tháng ${month.getMonth() + 1}/${month.getFullYear()}`;
  if ($('#app').hidden) $('#lerr').textContent = 'Đang đăng nhập...';
  try {
    data = await adm('admin_list', { month: ym(month) });
  } catch (e) {
    if (e.message === 'Sai mật khẩu') { sessionStorage.removeItem('pass'); $('#app').hidden = true; $('#login').hidden = false; $('#lerr').textContent = 'Sai mật khẩu, thử lại'; return; }
    return $($('#app').hidden ? '#lerr' : '#err').textContent = 'Lỗi: ' + e.message;
  }
  sessionStorage.setItem('pass', pass);
  $('#login').hidden = true; $('#app').hidden = false;
  render();
}

function render() {
  const open = data.shifts.filter(x => !x.ra);
  let total = 0;
  $('#stats').innerHTML = data.staff.map(s => {
    const mine = data.shifts.filter(x => x.ten === s.ten);
    const gio = mine.reduce((t, x) => t + (Number(x.gio) || 0), 0);
    const working = open.find(x => x.ten === s.ten && x.vao.slice(0, 10) === today());
    total += gio * s.luong;
    return `<div class="card stat">
      <div class="top"><div class="avatar ${color(s.ten)}">${initial(s.ten)}</div>
        <div><div class="name">${esc(s.ten)}</div>
        ${working ? `<span class="pill on">Đang làm từ ${esc(working.vao.slice(11))}</span>` : `<span class="pill off">Không trong ca</span>`}</div></div>
      <div class="money num">${money(gio * s.luong)}</div>
      <div class="meta num">${hm(gio)} · ${mine.length} ca · ${money(s.luong)}/giờ</div>
    </div>`;
  }).join('');
  $('#total').textContent = money(total);

  // Ca quên bấm ra = ca chưa ra từ trước hôm nay
  const forgot = open.filter(x => x.vao.slice(0, 10) !== today());
  $('#alerts').innerHTML = forgot.length ? `<div class="alert">${ICON.warn}<span>Quên bấm Ra ca: ${forgot.map(x => `${esc(x.ten)} ngày ${+x.vao.slice(8, 10)}/${+x.vao.slice(5, 7)}`).join(', ')}. Bấm ✎ ở dòng vàng để điền giờ ra.</span></div>` : '';

  $('#chips').innerHTML = ['', ...data.staff.map(s => s.ten)].map(t =>
    `<button class="chip ${t === who ? 'on' : ''}" data-who="${esc(t)}">${t ? esc(t) : 'Tất cả'}</button>`).join('');

  const days = {};
  data.shifts.filter(x => !who || x.ten === who).sort((a, b) => b.vao.localeCompare(a.vao))
    .forEach(x => (days[x.vao.slice(0, 10)] ||= []).push(x));
  $('#days').innerHTML = Object.entries(days).map(([d, rows]) => {
    const dt = new Date(d + 'T00:00');
    const sum = rows.reduce((t, x) => t + (Number(x.gio) || 0), 0);
    return `<div class="card day">
      <div class="day-head"><span>${d === today() ? 'Hôm nay' : DAYS[dt.getDay()]}, ${dt.getDate()}/${dt.getMonth() + 1}</span><span>${hm(sum)}</span></div>
      ${rows.map(x => {
        const i = data.shifts.indexOf(x), forgotten = !x.ra && d !== today();
        return `<div class="row ${forgotten ? 'open' : ''}">
          <div class="avatar ${color(x.ten)}">${initial(x.ten)}</div>
          <div class="who"><b>${esc(x.ten)}</b>
            <span class="time num">${esc(x.vao.slice(11))} → ${x.ra ? esc(x.ra.slice(11)) : forgotten ? '<span class="pill warn">quên ra ca</span>' : '<span class="pill on">đang làm</span>'}</span>
            ${x.note ? `<div class="note">${esc(x.note)}</div>` : ''}</div>
          <div class="dur num">${x.ra ? hm(x.gio) : ''}</div>
          <button class="icon" data-edit="${i}" aria-label="Sửa">${ICON.edit}</button>
          <button class="icon" data-del="${i}" aria-label="Xoá">${ICON.del}</button>
        </div>`;
      }).join('')}
    </div>`;
  }).join('') || `<div class="card empty">Chưa có lần chấm công nào trong tháng này</div>`;
}

function edit(x) {
  const f = $('#form');
  f.ten.innerHTML = data.staff.map(s => `<option>${esc(s.ten)}</option>`).join('');
  f.ten.value = x?.ten || data.staff[0]?.ten;
  f.ngay.value = x ? x.vao.slice(0, 10) : today();
  f.vao.value = x ? x.vao.slice(11) : ''; f.ra.value = x?.ra ? x.ra.slice(11) : ''; f.note.value = x?.note || '';
  $('#dtitle').textContent = x ? 'Sửa giờ làm' : 'Chấm bù';
  $('#dsub').textContent = x ? '' : 'Dùng khi nhân viên quên quét mã QR';
  $('#dlg').onclose = async () => {
    if ($('#dlg').returnValue !== 'ok') return;
    // giờ ra ≤ giờ vào → ca qua đêm, ra vào ngày hôm sau
    let ra = '';
    if (f.ra.value) {
      const d = new Date(f.ngay.value + 'T00:00');
      if (f.ra.value <= f.vao.value) d.setDate(d.getDate() + 1);
      ra = `${d.toLocaleDateString('sv')} ${f.ra.value}`;
    }
    try { await adm('admin_save', { row: x?.row || 0, ten: f.ten.value, vao: `${f.ngay.value} ${f.vao.value}`, ra, note: f.note.value }); }
    catch (e) { $('#err').textContent = 'Lỗi: ' + e.message; }
    load();
  };
  $('#dlg').returnValue = ''; // Esc không được lưu lại lựa chọn cũ
  $('#dlg').showModal();
}

function ask(text, sub) {
  $('#askText').textContent = text; $('#askSub').textContent = sub;
  $('#askDlg').showModal();
  return new Promise(ok => {
    $('#askYes').onclick = () => { $('#askDlg').close(); ok(true); };
    $('#askNo').onclick = () => { $('#askDlg').close(); ok(false); };
  });
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button')?.dataset || {};
  if (b.who !== undefined) { who = b.who; render(); }
  if (b.edit) edit(data.shifts[b.edit]);
  if (b.del) {
    const x = data.shifts[b.del];
    if (await ask('Xoá lần chấm công này?', `${x.ten} · ${x.vao}${x.ra ? ' → ' + x.ra.slice(11) : ''}`)) {
      try { await adm('admin_delete', { row: x.row }); } catch (e) { $('#err').textContent = 'Lỗi: ' + e.message; }
      load();
    }
  }
});

$('#login').onsubmit = e => { e.preventDefault(); pass = $('#pass').value.trim(); load(); };
$('#prev').onclick = () => { month.setMonth(month.getMonth() - 1); load(); };
$('#next').onclick = () => { month.setMonth(month.getMonth() + 1); load(); };
$('#add').onclick = () => edit(null);
$('#showqr').onclick = () => {
  const url = new URL('./', location.href).href;
  $('#qr').innerHTML = ''; new QRCode($('#qr'), { text: url, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
  $('#qrurl').textContent = url;
  $('#qrDlg').showModal();
};

if (pass) load(); else $('#pass').focus();
</script>
</body>
</html>
