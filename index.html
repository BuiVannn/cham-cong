<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chấm công</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 0 auto; padding: 24px 16px; background: #f5f5f5; color: #222; }
  h2 { text-align: center; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin: 12px 0; box-shadow: 0 1px 4px #0001; display: flex; align-items: center; gap: 12px; }
  .card div { flex: 1; } .card b { font-size: 20px; } .card small { color: #666; }
  button { font-size: 17px; font-weight: 600; padding: 14px 18px; border: 0; border-radius: 10px; color: #fff; background: #16a34a; min-width: 110px; }
  button.out { background: #dc2626; }
  button:disabled { opacity: .5; }
  #msg { text-align: center; min-height: 1.5em; }
  .err { color: #dc2626; } .ok { color: #16a34a; font-weight: 600; }
</style>
</head>
<body>
<h2>Chấm công</h2>
<div id="list">Đang tải...</div>
<p id="msg"></p>

<script src="api.js"></script>
<script>
const say = (t, cls = '') => { $('#msg').className = cls; $('#msg').textContent = t; };

async function load() {
  const board = await api('board');
  $('#list').innerHTML = board.map(x => `<div class="card">
      <div><b>${esc(x.ten)}</b><br><small>${x.vao ? 'Đang làm từ ' + esc(x.vao) : 'Chưa vào ca'}</small></div>
      <button class="${x.vao ? 'out' : ''}" data-ten="${esc(x.ten)}" data-type="${x.vao ? 'out' : 'in'}">${x.vao ? 'RA CA' : 'VÀO CA'}</button>
    </div>`).join('');
}

$('#list').onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;
  const { ten, type } = b.dataset, label = type === 'in' ? 'Vào ca' : 'Ra ca';
  if (!confirm(`${ten} — ${label}?`)) return;
  document.querySelectorAll('button').forEach(x => x.disabled = true);
  say('Đang lấy vị trí...');
  navigator.geolocation.getCurrentPosition(async p => {
    try {
      const t = await api('punch', { name: ten, type, lat: p.coords.latitude, lng: p.coords.longitude });
      say(`✓ ${ten} ${label.toLowerCase()} lúc ${t.slice(11)}`, 'ok');
      await load();
    } catch (err) { say(err.message, 'err'); document.querySelectorAll('button').forEach(x => x.disabled = false); }
  }, err => {
    say('Không lấy được vị trí. Bật định vị (GPS) và cho phép truy cập vị trí. Nếu mở bằng Zalo không được: bấm ⋯ → Mở bằng trình duyệt.', 'err');
    document.querySelectorAll('button').forEach(x => x.disabled = false);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
};

load().catch(e => say(e.message, 'err'));
</script>
</body>
</html>
