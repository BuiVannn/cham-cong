<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ec">
<title>Chấm công</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  main { max-width: 440px; margin: 0 auto; padding: 32px 16px 48px; }
  header { text-align: center; margin-bottom: 28px; }
  .label { font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--brand); text-transform: uppercase; }
  #clock { font-size: 64px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin-top: 6px; }
  #date { color: var(--muted); font-size: 16px; }

  .hint { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .staff { padding: 18px; margin-bottom: 12px; }
  .staff .top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .staff .name { font-size: 20px; font-weight: 700; }
  .staff .sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .staff .btn { width: 100%; padding: 16px; font-size: 18px; border-radius: 14px; }
  .skeleton { height: 150px; background: linear-gradient(90deg, #fff 30%, #f5f5f4 50%, #fff 70%) 0 0 / 300% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { to { background-position: -150% 0; } }

  #toast { position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); max-width: 408px; margin: 0 auto; padding: 14px 16px; border-radius: 14px; background: #7f1d1d; color: #fff; font-size: 15px; box-shadow: var(--shadow); }

  #sheet { margin: auto auto 0; width: 100%; max-width: 440px; border-radius: 24px 24px 0 0; padding: 24px 20px max(24px, env(safe-area-inset-bottom)); text-align: center; }
  #sheet .avatar { width: 64px; height: 64px; font-size: 28px; margin: 0 auto 12px; }
  #sheet .big { font-size: 40px; font-weight: 800; margin: 4px 0; }

  #done { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; color: #fff; padding: 24px; animation: fade .2s; }
  #done.in { background: var(--in); } #done.out { background: var(--out); }
  #done svg { width: 96px; height: 96px; margin: 0 auto 16px; }
  #done .t1 { font-size: 26px; font-weight: 700; } #done .t2 { font-size: 56px; font-weight: 800; }
  @keyframes fade { from { opacity: 0; transform: scale(.96); } }
  .state { text-align: center; padding: 28px 20px; color: var(--muted); }
  .state .btn { margin-top: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="label">Chấm công</div>
    <div id="clock" class="num">--:--</div>
    <div id="date"></div>
  </header>
  <p class="hint">Bấm nút dưới tên của bạn</p>
  <div id="list"></div>
</main>

<div id="toast" hidden></div>

<dialog id="sheet">
  <div id="sAvatar" class="avatar"></div>
  <div id="sText" class="muted"></div>
  <div id="sTime" class="big num"></div>
  <div class="muted" style="font-size:14px">Cần bật định vị để xác nhận bạn đang ở cửa hàng</div>
  <div class="actions">
    <button class="btn ghost" id="sNo">Huỷ</button>
    <button class="btn" id="sYes">Xác nhận</button>
  </div>
</dialog>

<div id="done" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>
  <div class="t1" id="dText"></div>
  <div class="t2 num" id="dTime"></div>
</div>

<script src="api.js"></script>
<script>
const DAYS = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
const now = () => new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false });
let board = [], pick = null, toastTimer;

function tick() {
  const d = new Date();
  $('#clock').textContent = now();
  $('#date').textContent = `${DAYS[d.getDay()]}, ${d.getDate()} tháng ${d.getMonth() + 1}`;
}
tick(); setInterval(tick, 1000);

function toast(t) {
  $('#toast').textContent = t; $('#toast').hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').hidden = true, 6000);
}

// "08:00" → thời gian đã làm tới giờ (ca qua đêm thì cộng 24h)
function since(vao) {
  const [h, m] = vao.split(':'), d = new Date();
  let mins = d.getHours() * 60 + d.getMinutes() - (h * 60 + +m);
  if (mins < 0) mins += 1440;
  return hm(mins / 60);
}

function render() {
  $('#list').innerHTML = board.map((x, i) => `
    <div class="card staff">
      <div class="top">
        <div class="avatar c${i % 4}">${initial(x.ten)}</div>
        <div>
          <div class="name">${esc(x.ten)}</div>
          <div class="sub">${x.vao
            ? `<span class="pill on">Đang làm</span> từ ${esc(x.vao)} · ${since(x.vao)}`
            : `<span class="pill off">Chưa vào ca</span>`}</div>
        </div>
      </div>
      <button class="btn ${x.vao ? 'out' : 'in'}" data-i="${i}">${x.vao ? 'Ra ca' : 'Vào ca'}</button>
    </div>`).join('');
}

// Nhớ trạng thái lần trước để quét QR là hiện ngay; dữ liệu mới tải ngầm (Apps Script mất 2–9 giây mỗi lần gọi)
const saved = { get() { try { return JSON.parse(localStorage.getItem('board')) || []; } catch { return []; } },
                set(b) { try { localStorage.setItem('board', JSON.stringify(b)); } catch {} } };

async function load() {
  if (!board.length && (board = saved.get()).length) render();
  if (!board.length) $('#list').innerHTML = '<div class="card staff skeleton"></div><div class="card staff skeleton"></div><p class="hint" id="slow"></p>';
  const slow = setTimeout(() => $('#slow') && ($('#slow').textContent = 'Đang kết nối máy chủ, có thể mất 5–10 giây...'), 3000);
  try { board = await api('board'); saved.set(board); render(); }
  catch (e) {
    if (!board.length) $('#list').innerHTML = `<div class="card state">${esc(e.message)}<br><button class="btn" onclick="load()">Thử lại</button></div>`;
    else toast(e.message);
  } finally { clearTimeout(slow); }
}
setInterval(() => board.length && render(), 60000);

// Lấy GPS ngay khi bấm tên (song song lúc nhân viên đọc bảng xác nhận) → bấm Xác nhận là gửi luôn
let gps;
const locate = () => new Promise((ok, fail) => navigator.geolocation.getCurrentPosition(ok, fail,
  { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 }));

$('#list').onclick = e => {
  const b = e.target.closest('button[data-i]');
  if (!b) return;
  pick = board[b.dataset.i];
  gps = locate(); gps.catch(() => {});
  const i = +b.dataset.i;
  $('#sAvatar').className = `avatar c${i % 4}`; $('#sAvatar').innerHTML = initial(pick.ten);
  $('#sText').textContent = `${pick.ten} — ${pick.vao ? 'ra ca' : 'vào ca'} lúc`;
  $('#sTime').textContent = now();
  $('#sYes').className = `btn ${pick.vao ? 'out' : 'in'}`;
  $('#sYes').textContent = pick.vao ? 'Xác nhận ra ca' : 'Xác nhận vào ca';
  $('#sYes').disabled = false;
  $('#sheet').showModal();
};
$('#sNo').onclick = () => $('#sheet').close();

$('#sYes').onclick = async () => {
  const x = pick, type = x.vao ? 'out' : 'in', btn = $('#sYes');
  btn.disabled = true; btn.textContent = 'Đang lấy vị trí...';
  let p;
  try { p = await gps; } catch {
    $('#sheet').close();
    return toast('Không lấy được vị trí. Hãy bật Định vị và cho phép trang truy cập vị trí. Nếu đang mở trong Zalo: bấm ⋯ → Mở bằng trình duyệt.');
  }
  btn.textContent = 'Đang ghi công...';
  try {
    const r = await api('punch', { name: x.ten, type, lat: p.coords.latitude, lng: p.coords.longitude });
    board = r.board; saved.set(board); render();
    $('#sheet').close();
    $('#done').className = type; $('#dText').textContent = `${x.ten} đã ${type === 'in' ? 'vào ca' : 'ra ca'}`;
    $('#dTime').textContent = r.time.slice(11); $('#done').hidden = false;
    setTimeout(() => $('#done').hidden = true, 2500);
  } catch (err) {
    $('#sheet').close();
    // Rớt mạng giữa chừng: không biết server đã ghi chưa → tải lại trạng thái để nhân viên tự xem
    if (err instanceof NetError) { toast('Mạng chập chờn, chưa chắc đã chấm được. Xem trạng thái bên trên: nếu chưa đổi thì bấm lại.'); load(); }
    else { toast(err.message); load(); } // vd "đang trong ca" do trạng thái cũ → tải lại trạng thái đúng
  }
};

load();
</script>
</body>
</html>
